<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} | Malik</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="https://whosmalikx.com{{path}}">
  <script>try { const theme = localStorage.getItem("main-site-theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="preload" href="/assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <!-- Generated from {{source}} by scripts/build_pages.py. Edit the Markdown, not this file. -->
  <div class="site-shell">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/" aria-label="Home">
          <span class="brand__mark"></span>
          <span class="brand__text">Malik</span>
        </a>
        <nav class="topbar__actions" aria-label="Site">
          <button id="themeToggle" class="icon-btn theme-toggle" type="button" aria-label="Switch to light theme"></button>
        </nav>
      </div>
    </header>

    <main class="container-narrow policy-layout">
      <article class="article-panel">
        <a href="/" class="back-link"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg><span>Back to Home</span></a>

        <div class="article-content">
          <h1 class="hero-title">{{title}}</h1>

          <p class="revision-date">Last Revised: <a href="{{history}}" target="_blank" rel="noopener noreferrer"><time datetime="{{revised_iso}}">{{revised}}</time></a></p>
          <hr />

{{content}}
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container-wide site-footer__inner">
        <p class="site-footer__note">Copyright &copy; {{year}} Malik. All rights reserved.</p>
        <nav class="site-footer__links" aria-label="Footer">
          <a href="/privacy" class="footer-link">Privacy Policy</a>
        </nav>
      </div>
    </footer>
  </div>

  <script src="/assets/js/theme.js"></script>
</body>
</html>
